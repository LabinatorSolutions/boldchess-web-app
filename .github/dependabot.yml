# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # The project is managed with Bun: the `bun` ecosystem updates package.json
  # together with bun.lock, which the `npm` ecosystem cannot rewrite.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
