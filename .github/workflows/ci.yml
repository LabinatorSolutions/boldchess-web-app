name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify deploy headers are in sync
        run: node scripts/generate-headers.js --check

      - name: Lint and format check
        run: bunx biome ci .

      - name: Tests
        run: bun test
